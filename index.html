<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#0e0f11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Acompañ.Ar — Reducción de Daños</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════
         Acompañ.Ar — Design System v5 "MARS"
         Bold coral + deep warm-black, cream ink. Corner-cut panels with coral
         tabs, big uppercase grotesque display, outlined-pill navigation,
         circular motifs, index markers, label:value data lists. Confident,
         graphic, editorial. Elevation via lighter warm surfaces, not shadows.
         ═══════════════════════════════════════ */
    :root {
      /* ── Surface ladder (solid, WARM; lighter = higher elevation) ── */
      --bg-primary: #130F0B;   /* app canvas — deep warm near-black */
      --bg-secondary: #17120D; /* sidebar / chrome */
      --bg-tertiary: #1E1811;  /* raised */
      --surface-1: #1C160F;    /* panel base */
      --surface-2: #251E15;    /* panel hover / nested */
      --surface-3: #322820;    /* active / popover */
      --surface: var(--surface-1);
      --surface-hover: var(--surface-2);
      --surface-active: var(--surface-3);

      /* ── Aliases kept for back-compat ── */
      --bg-paper-100: var(--bg-primary);
      --bg-paper-200: var(--bg-secondary);
      --bg-surface: var(--bg-tertiary);
      --bg: var(--bg-primary);

      /* ── Text hierarchy — warm cream ink ── */
      --text-primary: rgba(247, 240, 232, 0.95);
      --text-secondary: rgba(247, 240, 232, 0.64);
      --text-tertiary: rgba(247, 240, 232, 0.45);
      --text-muted: rgba(247, 240, 232, 0.32);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      --text-ink-900: var(--text-primary);
      --text-ink-600: var(--text-secondary);
      --text-ink-400: var(--text-tertiary);

      /* ── Borders — warm hairline ── */
      --border-subtle: rgba(247, 240, 232, 0.07);
      --border-medium: rgba(247, 240, 232, 0.12);
      --border-strong: rgba(247, 240, 232, 0.18);
      --border: var(--border-subtle);
      --border-thick: 1px solid var(--border-medium);
      --border-editorial: 1px solid var(--border-subtle);

      /* ── Accent — Coral (primary brand), bold like the reference ── */
      --accent-primary: #E17A54;
      --accent-hover: #EC8D69;
      --accent-deep: #C25E3B;   /* darker coral for gradients / depth */
      --accent-ink: #2A1409;    /* text/icons on coral fills */
      --accent-subtle: rgba(225, 122, 84, 0.14);
      --accent-medium: rgba(225, 122, 84, 0.26);
      --accent-weak: rgba(225, 122, 84, 0.08);
      --accent: var(--accent-primary);

      /* ── Accent — Sage (secondary; safety / care sections) ── */
      --accent-secondary: #7FA08A;
      --accent-secondary-hover: #92B19C;
      --accent-secondary-subtle: rgba(127, 160, 138, 0.12);
      --accent-secondary-medium: rgba(127, 160, 138, 0.22);
      --accent-secondary-weak: rgba(127, 160, 138, 0.07);

      /* ── Semantic colors ── */
      --color-blue: #6AA5F4;
      --color-blue-subtle: rgba(106, 165, 244, 0.10);
      --color-blue-medium: rgba(106, 165, 244, 0.20);
      --color-green: #4ADE9E;
      --color-green-subtle: rgba(74, 222, 158, 0.10);
      --color-green-medium: rgba(74, 222, 158, 0.20);
      --color-amber: #F2B84B;
      --color-amber-subtle: rgba(242, 184, 75, 0.10);
      --color-amber-medium: rgba(242, 184, 75, 0.20);
      --color-red: #F0726E;
      --color-red-subtle: rgba(240, 114, 110, 0.10);
      --color-red-medium: rgba(240, 114, 110, 0.20);
      --color-violet: #A78BFA;
      --color-violet-subtle: rgba(167, 139, 250, 0.10);
      --color-violet-medium: rgba(167, 139, 250, 0.20);

      /* ── Shadows — used sparingly (modals/popovers only) ── */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.30);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.45);
      --shadow-ambient: 0 1px 2px rgba(0, 0, 0, 0.30);
      --shadow-lifted: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-glow-accent: 0 6px 22px rgba(199, 112, 92, 0.16);
      --shadow-modal: 0 24px 70px rgba(0, 0, 0, 0.60), 0 1px 0 rgba(255, 255, 255, 0.05) inset;

      /* ── Glass (modal/popover translucent surface) ── */
      --glass-bg: linear-gradient(165deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)), rgba(16, 17, 22, 0.85);
      --glass-bg-solid: rgba(20, 22, 27, 0.94);
      --glass-blur: blur(24px) saturate(140%);
      --glass-border: rgba(255, 255, 255, 0.10);

      /* ── Radius — tight, consistent ── */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-pill: 999px;

      /* ── Spacing — strict 8pt grid (4 is the only half-step) ── */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-8: 40px;
      --space-10: 48px;
      --space-12: 64px;
      --space-16: 96px;

      /* ── Typography ──
         One UI font (Inter). Serif (Newsreader) is DISPLAY-ONLY:
         reserved for large page titles, never for labels/body/chrome. */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Archivo Expanded', 'Archivo', 'Inter', sans-serif;
      --font-heading: 'Archivo', 'Inter', sans-serif;
      --font-editorial: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;

      /* Type scale */
      --font-size-xs: 12px;
      --font-size-sm: 13px;
      --font-size-base: 14px;
      --font-size-md: 15px;
      --font-size-lg: 17px;
      --font-size-xl: 20px;
      --font-size-2xl: 24px;
      --font-size-3xl: 30px;

      --line-height-tight: 1.2;
      --line-height-snug: 1.4;
      --line-height-normal: 1.5;
      --line-height-relaxed: 1.65;

      --letter-spacing-tight: -0.02em;

      /* ── Transitions & Easing ── */
      --transition-fast: 130ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 180ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 280ms cubic-bezier(0.4, 0, 0.2, 1);

      --t-fast: 130ms;
      --t-medium: 220ms;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out-strong: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Reset ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Buttons inherit type and carry no UA chrome by default — every styled
       button sets its own background/border explicitly. Prevents the UA
       default border (border-color: currentColor) from leaking through. */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    /* ── Base ── */
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: touch;
      font-family: var(--font-sans) !important;
      font-weight: 400;
      font-size: var(--font-size-base);
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      letter-spacing: -0.011em;
    }

    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary) !important;
    }

    /* ── Ambient Glow removed for editorial cleanness ── */
    body::before {
      display: none;
    }

    /* ── Scrollbar — Minimal ── */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--border-medium) transparent;
    }

    body {
      overflow-x: hidden;
    }

    /* ── Typography Hierarchy ── */
    h1 {
      font-size: var(--font-size-3xl);
      font-weight: 600;
      line-height: var(--line-height-tight);
      letter-spacing: -0.022em;
      color: var(--text-primary);
    }

    h2 {
      font-size: var(--font-size-2xl);
      font-weight: 600;
      line-height: var(--line-height-tight);
      letter-spacing: -0.019em;
      color: var(--text-primary);
    }

    h3 {
      font-size: var(--font-size-xl);
      font-weight: 600;
      line-height: var(--line-height-snug);
      letter-spacing: -0.016em;
      color: var(--text-primary);
    }

    h4,
    h5,
    h6 {
      font-size: var(--font-size-lg);
      font-weight: 600;
      line-height: var(--line-height-snug);
      letter-spacing: -0.013em;
      color: var(--text-secondary);
    }

    p {
      font-size: var(--font-size-base);
      line-height: var(--line-height-relaxed);
    }

    small {
      font-size: var(--font-size-sm);
      color: var(--text-tertiary);
    }

    /* ── Editorial text class ── */
    .editorial {
      font-family: var(--font-editorial);
    }

    /* ── Editorial Typography System ── */

    /* Drop cap — large initial letter for article content */
    .drop-cap::first-letter {
      float: left;
      font-family: var(--font-editorial);
      font-size: 3.2em;
      line-height: 0.82;
      font-weight: 700;
      margin-right: 8px;
      margin-top: 4px;
      color: var(--accent-primary);
    }

    /* Section heading — bold grotesque */
    .editorial-heading {
      font-family: var(--font-heading);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text-primary);
    }

    /* Subheading */
    .editorial-subtitle {
      font-family: var(--font-ui);
      font-weight: 400;
      color: var(--text-tertiary);
      line-height: 1.55;
      letter-spacing: -0.005em;
    }

    /* Section divider — hairline */
    .editorial-divider {
      border: none;
      height: 1px;
      background: var(--border-subtle);
      margin: 24px 0;
    }

    /* Accent divider — short rule */
    .editorial-divider-accent {
      border: none;
      height: 2px;
      background: var(--accent-primary);
      margin: 16px 0;
      width: 40px;
      border-radius: 999px;
    }

    /* Body text */
    .editorial-body {
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      font-weight: 400;
      text-rendering: optimizeLegibility;
    }

    .editorial-body strong {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Caption / meta — small label */
    .editorial-caption {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    /* Date stamp */
    .editorial-date {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-tertiary);
      letter-spacing: 0.01em;
    }

    /* Lead paragraph (was an italic serif pull-quote) */
    .editorial-pullquote {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-secondary);
      padding: 0 0 0 20px;
      border-left: 2px solid var(--accent-primary);
      background: transparent;
      margin: 4px 0 8px;
    }

    /* Category label — tag */
    .editorial-tag {
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-medium);
      color: var(--text-tertiary);
      display: inline-block;
    }

    /* Card — soft, tonal surface (depth via background, not heavy borders) */
    .editorial-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      transition: background var(--transition-base), border-color var(--transition-base), transform var(--transition-base), box-shadow var(--transition-base);
    }

    .editorial-card:hover {
      background: var(--surface-2);
      border-color: var(--border-medium);
    }

    /* Numbered list — editorial ordered list with accent numbers */
    .editorial-list {
      list-style: none;
      counter-reset: editorial-counter;
      padding: 0;
    }

    .editorial-list>li {
      counter-increment: editorial-counter;
      padding-left: 36px;
      position: relative;
      margin-bottom: 16px;
      font-family: var(--font-editorial);
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .editorial-list>li::before {
      content: counter(editorial-counter, decimal-leading-zero);
      position: absolute;
      left: 0;
      top: 0;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }

    /* Inline accent highlight */
    .accent-text {
      color: var(--accent-primary);
      font-weight: 600;
    }

    /* ── Editorial utility classes ── */
    .ed-border-thick {
      border: 1px solid var(--border-medium);
    }

    .ed-uppercase {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      font-size: 10px;
    }

    .ed-number-big {
      font-family: var(--font-editorial);
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .ed-geo-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: repeating-conic-gradient(rgba(255, 255, 255, 0.03) 0% 25%,
          transparent 25% 50%);
      position: absolute;
      pointer-events: none;
    }

    /* ── Transitions ── */
    * {
      transition: background-color var(--transition-base),
        border-color var(--transition-base),
        color var(--transition-fast),
        opacity var(--transition-fast);
    }

    button,
    a {
      transition: all var(--transition-base);
    }

    /* ── Tactile press feedback (premium micro-interaction) ── */
    button:not(:disabled) {
      cursor: pointer;
    }

    button:not(:disabled):active {
      transform: scale(0.97);
    }

    /* ── Focus States — soft glow ring, not a harsh outline ── */
    *:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px var(--bg-primary), 0 0 0 3px rgba(199, 112, 92, 0.45);
      border-radius: var(--radius-sm);
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    /* ── Tailwind Override Layer ── */
    body {
      background-color: var(--bg-primary) !important;
    }
  </style>

<body style="background-color: #0a0a0f !important;">
  <div id="root" style="background-color: #0a0a0f !important;"></div>
