<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ACompañ.Ar — Chatbot & Observatorio de Consumos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      /* ===== Design Tokens (Claude-style) ===== */
      :root {
        /* ===== Background & Surfaces ===== */
        --bg: #0b0d10;
        --surface-1: #0f1217;
        --surface-2: #121721;
        --surface-3: #151b27;

        /* ===== Text ===== */
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --faint: rgba(255, 255, 255, 0.48);

        /* ===== Borders (1px max, very subtle) ===== */
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.12);

        /* ===== Accent (warm sand) ===== */
        --accent: #d1995b;
        --accent-weak: rgba(209, 153, 91, 0.18);

        /* ===== Shadows (subtle, not cardy) ===== */
        --shadow-1: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
        --shadow-2: 0 12px 28px rgba(0, 0, 0, 0.45);

        /* ===== Radii ===== */
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;

        /* ===== Spacing (4px grid) ===== */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;

        /* ===== Typography ===== */
        /* UI Sans for navigation, labels, buttons, inputs */
        --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        /* Editorial Serif for long-form content, assistant responses */
        --font-editorial: "Newsreader", ui-serif, Georgia, serif;

        /* Type scale */
        --font-size-xs: 13px;
        --font-size-sm: 14px;
        --font-size-base: 16.5px; /* desktop */
        --font-size-md: 17px;
        --font-size-lg: 19px;
        --font-size-xl: 21px;
        --font-size-2xl: 26px;
        --font-size-3xl: 32px;

        /* Line height */
        --line-height-heading: 1.25;
        --line-height-body: 1.55;

        /* ===== Motion ===== */
        --t-fast: 140ms;
        --t-med: 200ms;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      /* Mobile font size adjustment */
      @media (max-width: 768px) {
        :root {
          --font-size-base: 16px;
        }
      }
      /* Reset box sizing and margins */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Base styles */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-overflow-scrolling: touch;
        font-family: var(--font-ui);
        font-weight: 400;
        font-size: var(--font-size-base);
        line-height: var(--line-height-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--text);
      }

      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Subtle ambient glow - warm accent */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 500px;
        background: radial-gradient(ellipse 100% 60% at 50% -30%, var(--accent-weak), transparent);
        pointer-events: none;
        z-index: 0;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Minimal scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
        transition: background var(--t-med) var(--ease);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-strong);
      }

      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      /* Prevent horizontal overflow */
      body {
        overflow-x: hidden;
      }

      /* Typography System */
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-ui);
      }

      h1 {
        font-size: var(--font-size-3xl);
        font-weight: 600;
        line-height: var(--line-height-heading);
        color: var(--text);
      }

      h2 {
        font-size: var(--font-size-2xl);
        font-weight: 600;
        line-height: var(--line-height-heading);
        color: var(--text);
      }

      h3 {
        font-size: var(--font-size-xl);
        font-weight: 600;
        line-height: var(--line-height-heading);
        color: var(--text);
      }

      h4, h5, h6 {
        font-size: var(--font-size-lg);
        font-weight: 500;
        line-height: var(--line-height-heading);
        color: var(--muted);
      }

      p {
        font-size: var(--font-size-base);
        line-height: var(--line-height-body);
      }

      small {
        font-size: var(--font-size-sm);
        color: var(--faint);
      }

      /* Editorial serif for long-form content */
      .editorial {
        font-family: var(--font-editorial);
        line-height: var(--line-height-body);
      }

      /* Focus states - warm ring for accessibility */
      *:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-weak);
        border-radius: var(--radius-sm);
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
