<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ACompañ.Ar — Chatbot & Observatorio de Consumos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ===== Design Tokens ===== */
      :root {
        /* Colors - Subtle, low contrast */
        --bg-primary: #0a0a0f;
        --bg-secondary: #0e0f14;
        --surface: rgba(255, 255, 255, 0.02);
        --surface-hover: rgba(255, 255, 255, 0.04);
        --surface-active: rgba(255, 255, 255, 0.06);

        /* Text */
        --text-primary: rgba(255, 255, 255, 0.92);
        --text-secondary: rgba(255, 255, 255, 0.64);
        --text-tertiary: rgba(255, 255, 255, 0.48);
        --text-muted: rgba(255, 255, 255, 0.32);

        /* Borders - Very subtle */
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-medium: rgba(255, 255, 255, 0.08);

        /* Accent */
        --accent-primary: #3b82f6;
        --accent-subtle: rgba(59, 130, 246, 0.12);
        --accent-medium: rgba(59, 130, 246, 0.20);

        /* Shadows - Diffuse */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);

        /* Radius */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;

        /* Spacing scale */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;

        /* Typography */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-size-xs: 13px;
        --font-size-sm: 14px;
        --font-size-base: 15px;
        --font-size-md: 16px;
        --font-size-lg: 18px;
        --font-size-xl: 20px;
        --font-size-2xl: 24px;
        --font-size-3xl: 30px;

        --line-height-tight: 1.25;
        --line-height-snug: 1.375;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.625;

        /* Transitions */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* Reset box sizing and margins */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Base styles */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-overflow-scrolling: touch;
        font-family: var(--font-sans);
        font-weight: 400;
        font-size: var(--font-size-base);
        line-height: var(--line-height-normal);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg-primary);
        color: var(--text-primary);
        letter-spacing: -0.011em;
      }

      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Subtle ambient glow - very minimal */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 500px;
        background: radial-gradient(ellipse 100% 60% at 50% -30%, rgba(59, 130, 246, 0.04), transparent);
        pointer-events: none;
        z-index: 0;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Minimal scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-medium);
        border-radius: 2px;
        transition: background var(--transition-base);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-subtle);
      }

      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-medium) transparent;
      }

      /* Prevent horizontal overflow */
      body {
        overflow-x: hidden;
      }

      /* Typography System */
      h1 {
        font-size: var(--font-size-3xl);
        font-weight: 700;
        line-height: var(--line-height-tight);
        letter-spacing: -0.022em;
        color: var(--text-primary);
      }

      h2 {
        font-size: var(--font-size-2xl);
        font-weight: 600;
        line-height: var(--line-height-tight);
        letter-spacing: -0.019em;
        color: var(--text-primary);
      }

      h3 {
        font-size: var(--font-size-xl);
        font-weight: 600;
        line-height: var(--line-height-snug);
        letter-spacing: -0.016em;
        color: var(--text-primary);
      }

      h4, h5, h6 {
        font-size: var(--font-size-lg);
        font-weight: 500;
        line-height: var(--line-height-snug);
        letter-spacing: -0.013em;
        color: var(--text-secondary);
      }

      p {
        font-size: var(--font-size-base);
        line-height: var(--line-height-relaxed);
      }

      small {
        font-size: var(--font-size-sm);
        color: var(--text-tertiary);
      }

      /* Smooth, subtle transitions */
      * {
        transition: background-color var(--transition-base),
                    border-color var(--transition-base),
                    color var(--transition-fast),
                    opacity var(--transition-fast);
      }

      button, a {
        transition: all var(--transition-base);
      }

      /* Focus states - accessible and elegant */
      *:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
    </style>
