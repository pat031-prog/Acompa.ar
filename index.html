<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Acompañ.Ar — Reducción de Daños</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* ═══════════════════════════════════════
         Acompañ.Ar — Design System v2
         Professional dark theme + terracotta accent
         ═══════════════════════════════════════ */
      :root {
        /* ── Core Palette ── */
        --bg-primary: #0a0a0f;
        --bg-secondary: #0e0f14;
        --bg-tertiary: #131419;
        --surface: rgba(255, 255, 255, 0.02);
        --surface-hover: rgba(255, 255, 255, 0.04);
        --surface-active: rgba(255, 255, 255, 0.06);
        --surface-1: rgba(255, 255, 255, 0.03);
        --surface-2: rgba(255, 255, 255, 0.05);
        --surface-3: rgba(255, 255, 255, 0.07);

        /* ── Digital Humanism aliases (warm paper mapped to dark) ── */
        --bg-paper-100: var(--bg-primary);
        --bg-paper-200: var(--bg-secondary);
        --bg-surface: var(--bg-tertiary);
        --bg: var(--bg-primary);

        /* ── Text Hierarchy ── */
        --text-primary: rgba(255, 255, 255, 0.92);
        --text-secondary: rgba(255, 255, 255, 0.64);
        --text-tertiary: rgba(255, 255, 255, 0.48);
        --text-muted: rgba(255, 255, 255, 0.32);
        --text: var(--text-primary);
        --muted: var(--text-secondary);

        /* Text ink aliases (for Home/Dashboard) */
        --text-ink-900: rgba(255, 255, 255, 0.92);
        --text-ink-600: rgba(255, 255, 255, 0.56);
        --text-ink-400: rgba(255, 255, 255, 0.38);

        /* ── Borders ── */
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-medium: rgba(255, 255, 255, 0.10);
        --border: var(--border-subtle);

        /* ── Accent — Terracotta ── */
        --accent-primary: #C7705C;
        --accent-hover: #d4826f;
        --accent-subtle: rgba(199, 112, 92, 0.12);
        --accent-medium: rgba(199, 112, 92, 0.20);
        --accent-weak: rgba(199, 112, 92, 0.08);
        --accent: var(--accent-primary);

        /* ── Shadows ── */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        --shadow-ambient: 0 1px 3px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(0, 0, 0, 0.15);
        --shadow-lifted: 0 8px 24px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.2);

        /* ── Radius ── */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;

        /* ── Spacing ── */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;

        /* ── Typography ── */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-editorial: 'Newsreader', Georgia, 'Times New Roman', serif;

        --font-size-xs: 13px;
        --font-size-sm: 14px;
        --font-size-base: 15px;
        --font-size-md: 16px;
        --font-size-lg: 18px;
        --font-size-xl: 20px;
        --font-size-2xl: 24px;
        --font-size-3xl: 30px;

        --line-height-tight: 1.25;
        --line-height-snug: 1.375;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.625;

        --letter-spacing-tight: -0.02em;

        /* ── Transitions & Easing ── */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);

        --t-fast: 150ms;
        --t-medium: 250ms;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-out-strong: cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* ── Reset ── */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ── Base ── */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-overflow-scrolling: touch;
        font-family: var(--font-sans) !important;
        font-weight: 400;
        font-size: var(--font-size-base);
        line-height: var(--line-height-normal);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg-primary) !important;
        color: var(--text-primary) !important;
        letter-spacing: -0.011em;
      }

      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-primary) !important;
      }

      /* ── Ambient Glow — Warm Terracotta ── */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 600px;
        background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(199, 112, 92, 0.04), transparent);
        pointer-events: none;
        z-index: 0;
      }

      /* ── Scrollbar — Minimal ── */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

      * { scrollbar-width: thin; scrollbar-color: var(--border-medium) transparent; }

      body { overflow-x: hidden; }

      /* ── Typography Hierarchy ── */
      h1 {
        font-size: var(--font-size-3xl);
        font-weight: 700;
        line-height: var(--line-height-tight);
        letter-spacing: -0.022em;
        color: var(--text-primary);
      }

      h2 {
        font-size: var(--font-size-2xl);
        font-weight: 600;
        line-height: var(--line-height-tight);
        letter-spacing: -0.019em;
        color: var(--text-primary);
      }

      h3 {
        font-size: var(--font-size-xl);
        font-weight: 600;
        line-height: var(--line-height-snug);
        letter-spacing: -0.016em;
        color: var(--text-primary);
      }

      h4, h5, h6 {
        font-size: var(--font-size-lg);
        font-weight: 500;
        line-height: var(--line-height-snug);
        letter-spacing: -0.013em;
        color: var(--text-secondary);
      }

      p {
        font-size: var(--font-size-base);
        line-height: var(--line-height-relaxed);
      }

      small {
        font-size: var(--font-size-sm);
        color: var(--text-tertiary);
      }

      /* ── Editorial text class ── */
      .editorial {
        font-family: var(--font-editorial);
      }

      /* ── Transitions ── */
      * {
        transition: background-color var(--transition-base),
                    border-color var(--transition-base),
                    color var(--transition-fast),
                    opacity var(--transition-fast);
      }

      button, a { transition: all var(--transition-base); }

      /* ── Focus States ── */
      *:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      /* ── Animations ── */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* ── Tailwind Override Layer ── */
      body {
        background-color: var(--bg-primary) !important;
      }
    </style>

</head>

</html>
