<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#ECEAE5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ACompañ.Ar — Chatbot & Observatorio de Consumos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <style>
      /* ===== DIGITAL HUMANISM DESIGN SYSTEM ===== */
      /* High-fidelity Anthropic/Claude aesthetic: Warm, Intellectual, Printed */
      :root {
        /* ===== Canvas & Surfaces (Paper & Cream) ===== */
        --bg-paper-100: #ECEAE5;  /* Main background - Darker warm gray paper */
        --bg-paper-200: #DDD9D1;  /* Sidebar/Secondary - Strong contrast */
        --bg-surface: #F8F6F3;    /* Cards/Inputs - Off-white with character */

        /* ===== Ink (Typography) ===== */
        --text-ink-900: #161412;  /* Primary text - Deep warm black */
        --text-ink-600: #54504C;  /* Secondary text - Darker warm grey */
        --text-ink-400: #83807B;  /* Placeholder/Disabled - Visible grey */

        /* ===== Maple Accent (Brand) ===== */
        --accent-primary: #D97757;   /* Terracotta/Burnt orange - The Claude accent */
        --accent-hover: #C56A4C;     /* Hover state - Darker terracotta */
        --accent-surface: #F5E4DD;   /* Light terracotta wash (darker) */
        --accent-weak: rgba(217, 119, 87, 0.18); /* Subtle accent overlay */

        /* ===== Borders (Etched lines) ===== */
        --border-subtle: #D0CCC4;    /* Subtle etched line (darker) */
        --border-medium: #BAB6AE;    /* Medium border (darker) */
        --border-strong: #9D9990;    /* Strong border (darker) */

        /* ===== Shadows (Ambient Occlusion, not drop shadows) ===== */
        --shadow-ambient: 0 1px 2px 0 rgba(0, 0, 0, 0.06), 0 4px 16px 0 rgba(0, 0, 0, 0.04);
        --shadow-lifted: 0 2px 6px 0 rgba(0, 0, 0, 0.08), 0 8px 24px 0 rgba(0, 0, 0, 0.06);
        --shadow-focus: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--accent-primary);
        --shadow-inset: inset 0 1px 3px 0 rgba(0, 0, 0, 0.08); /* Etched/pressed effect */

        /* ===== Super-Ellipse Radii ===== */
        --radius-sm: 6px;    /* Buttons */
        --radius-md: 8px;    /* Small cards */
        --radius-lg: 12px;   /* Inputs */
        --radius-xl: 16px;   /* Large cards */
        --radius-2xl: 20px;  /* Containers */

        /* ===== Spacing (Fluid system, 4px grid) ===== */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;

        /* ===== Typography (Dual System) ===== */
        /* UI Sans: Inter - for navigation, labels, buttons, inputs */
        --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        /* Editorial Serif: Newsreader - for headings, long-form, assistant responses */
        --font-editorial: "Newsreader", ui-serif, Georgia, "Times New Roman", serif;

        /* Type scale (Refined) */
        --font-size-xs: 12px;
        --font-size-sm: 14px;
        --font-size-base: 16px;
        --font-size-md: 18px;
        --font-size-lg: 20px;
        --font-size-xl: 24px;
        --font-size-2xl: 30px;
        --font-size-3xl: 36px;
        --font-size-4xl: 48px;

        /* Line heights */
        --line-height-tight: 1.25;   /* Headings */
        --line-height-base: 1.5;     /* UI */
        --line-height-relaxed: 1.6;  /* Body text */
        --line-height-loose: 1.75;   /* Editorial */

        /* Letter spacing (Key for "Editorial" look) */
        --letter-spacing-tight: -0.025em;  /* Serif headings */
        --letter-spacing-normal: -0.01em;  /* Sans UI */
        --letter-spacing-wide: 0.025em;    /* All caps */

        /* ===== Motion (Expensive animations) ===== */
        --t-fast: 150ms;
        --t-medium: 300ms;
        --t-slow: 400ms;
        --ease-out-strong: cubic-bezier(0.2, 0.0, 0.0, 1.0);  /* Strong ease-out */
        --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1.0);    /* Standard easing */

        /* ===== Layout ===== */
        --sidebar-width: 280px;
        --content-max-width: 768px;  /* 48rem - Optimal reading length */
      }

      /* Mobile adjustments */
      @media (max-width: 768px) {
        :root {
          --font-size-base: 15px;
          --font-size-2xl: 26px;
          --font-size-3xl: 32px;
        }
      }
      /* Reset box sizing and margins */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Base styles - "Printed Matter" aesthetic */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-overflow-scrolling: touch;
        font-family: var(--font-ui);
        font-weight: 400;
        font-size: var(--font-size-base);
        line-height: var(--line-height-relaxed);
        letter-spacing: var(--letter-spacing-normal);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background: var(--bg-paper-100);
        color: var(--text-ink-900);
      }

      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Subtle warm ambient diffusion (like daylight through a window) */
      body::before {
        content: '';
        position: fixed;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 1200px;
        height: 600px;
        background: radial-gradient(ellipse at center, var(--accent-surface), transparent 70%);
        pointer-events: none;
        z-index: 0;
        opacity: 0.4;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Refined scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-paper-200);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-medium);
        border-radius: 3px;
        transition: background var(--t-fast) var(--ease-standard);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-strong);
      }

      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border-medium) var(--bg-paper-200);
      }

      /* Prevent horizontal overflow */
      body {
        overflow-x: hidden;
      }

      /* Typography System - Dual Typeface */
      h1, h2, h3 {
        font-family: var(--font-editorial);  /* Serif for major headings */
        letter-spacing: var(--letter-spacing-tight);
      }

      h4, h5, h6 {
        font-family: var(--font-ui);  /* Sans for minor headings */
      }

      h1 {
        font-size: var(--font-size-3xl);
        font-weight: 600;
        line-height: var(--line-height-tight);
        color: var(--text-ink-900);
      }

      h2 {
        font-size: var(--font-size-2xl);
        font-weight: 600;
        line-height: var(--line-height-tight);
        color: var(--text-ink-900);
      }

      h3 {
        font-size: var(--font-size-xl);
        font-weight: 600;
        line-height: var(--line-height-tight);
        color: var(--text-ink-900);
      }

      h4, h5, h6 {
        font-size: var(--font-size-lg);
        font-weight: 600;
        line-height: var(--line-height-base);
        color: var(--text-ink-600);
      }

      p {
        font-size: var(--font-size-base);
        line-height: var(--line-height-relaxed);
        color: var(--text-ink-900);
      }

      small {
        font-size: var(--font-size-sm);
        color: var(--text-ink-400);
      }

      /* Editorial serif for long-form content */
      .editorial {
        font-family: var(--font-editorial);
        line-height: var(--line-height-loose);
        color: var(--text-ink-600);
      }

      /* Focus states - Double ring for accessibility */
      *:focus-visible {
        outline: none;
        box-shadow: var(--shadow-focus);
        border-radius: var(--radius-sm);
      }

      /* ===== Animations & Effects (Expensive feel) ===== */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      /* Hover lift effect (Ambient Occlusion) */
      .hover-lift {
        position: relative;
        transition: all var(--t-medium) var(--ease-out-strong);
      }

      .hover-lift:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-lifted);
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
        .hover-lift:hover {
          transform: none;
        }
      }

      /* ===== Backwards Compatibility Aliases ===== */
      /* Map old tokens to new system for existing components */
      :root {
        --bg: var(--bg-paper-100);
        --surface-1: var(--bg-surface);
        --surface-2: var(--bg-paper-200);
        --surface-3: var(--accent-surface);
        --text: var(--text-ink-900);
        --muted: var(--text-ink-600);
        --faint: var(--text-ink-400);
        --border: var(--border-subtle);
        --border-strong: var(--border-medium);
        --accent: var(--accent-primary);
        --accent-weak: var(--accent-weak);
        --shadow-1: var(--shadow-ambient);
        --shadow-2: var(--shadow-lifted);
        --line-height-heading: var(--line-height-tight);
        --line-height-body: var(--line-height-relaxed);
        --t-fast: var(--t-fast);
        --t-med: var(--t-medium);
        --ease: var(--ease-standard);
      }
    </style>
